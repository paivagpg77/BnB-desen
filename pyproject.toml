[project]
name = "lei-do-bem-analise"
version = "0.1.0"
description = "Apoio a analise preliminar de elegibilidade a Lei do Bem (Hackathon STS 2026, desafio BNB)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pypdf>=4.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
app = [
    "streamlit>=1.40",
]
semantica = [
    "sentence-transformers>=3.0",
]
mcp = [
    "mcp>=2.0",
]
dev = [
    "pytest>=8.0",
    "streamlit>=1.40",
    "mcp>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
